name: Auto Bitcoin Trading

on:
  schedule:
    # UTC 기준: 00:00, 08:00, 16:00 (KST 기준: 09:00, 17:00, 01:00)
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading bot
        env:
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        run: |
          python gptbitcoin.py

      - name: Upload trading database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-data-${{ github.run_number }}
          path: trading_data.db
          retention-days: 30
